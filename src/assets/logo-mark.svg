<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="TRONIC logo mark">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1aa3ff"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0b1020" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Hexagon base -->
  <polygon points="32,4 58,18 58,46 32,60 6,46 6,18" fill="url(#g)" filter="url(#s)"/>
  <!-- Inner cutout to form border -->
  <polygon points="32,10 52,21 52,43 32,54 12,43 12,21" fill="#0f172a"/>
  <!-- Stylized T -->
  <rect x="18" y="22" width="28" height="6" rx="2" ry="2" fill="#e5e7eb"/>
  <rect x="30" y="28" width="6" height="16" rx="2" ry="2" fill="#e5e7eb"/>
</svg>

